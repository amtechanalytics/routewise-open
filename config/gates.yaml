parse_floor: 0.85            # rolling (last 50) and per-stage
max_vendor_error_rate: 0.01  # cells still failing after retries; resume retries them
empty_reply_ceiling: 0.2     # share of a model's replies with no content (not a parse failure) before the gate fails
liveness:
  stall_minutes: 20           # no progress (sync calls) -> restart
  batch_stall_minutes: 240    # while waiting on a vendor batch
  max_restarts_per_rung: 2        # plain restarts, only for failures that can be transient (network, timeout, vanished)
  repair:                         # the repair step is governed by the failure signature, not by a count per run:
    same_signature_max: 2         #   a new failure always gets a repair; the same failure again gets this many in a row
    max_per_run: 12               #   hard cap on repairs in one run
    max_minutes_per_run: 180      #   hard cap on total repair time in one run
  executor_timeout_minutes: 40
  executor_estimate_usd: 3.0
